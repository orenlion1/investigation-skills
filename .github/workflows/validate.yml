name: Validate

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # Keep dependency installation on a known runner release rather than a moving OS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install diagram test dependency
        shell: bash
        run: |
          if command -v dot >/dev/null 2>&1; then
            dot -V
            exit 0
          fi
          # Use signed official archives over HTTPS, scoped to these APT commands.
          cat > "$RUNNER_TEMP/ubuntu-https.list" <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe
          SOURCES
          apt_options=(
            -o "Dir::Etc::sourcelist=$RUNNER_TEMP/ubuntu-https.list"
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=1
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends graphviz
          dot -V
      - name: Install reference validation dependencies
        run: python3 -m pip install -r skills/report-evidence/scripts/requirements.txt
      - name: Verify the profile-manager chain end to end
        run: python3 -m unittest tests.test_profile_manager_e2e -v
      - name: Validate metadata and run all repository and skill checks
        run: bash scripts/check.sh

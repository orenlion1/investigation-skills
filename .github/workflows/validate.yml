name: Validate

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # Keep dependency installation on a known runner release rather than a moving OS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install diagram test dependency
        shell: bash
        run: |
          if command -v dot >/dev/null 2>&1; then
            dot -V
            exit 0
          fi
          graphviz_root="$RUNNER_TEMP/graphviz-16.1.1"
          package="$RUNNER_TEMP/graphviz-16.1.1.deb"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 \
            https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.1/ubuntu_24.04_graphviz-16.1.1-cmake.deb \
            --output "$package"
          printf '%s  %s\n' a662640725bc5375e6baafefcfb4444d62d174dc31eb0c35746f6cf1b9dd21fc "$package" | sha256sum --check -
          dpkg-deb --extract "$package" "$graphviz_root"
          mkdir -p "$RUNNER_TEMP/graphviz-bin"
          # Scope plugin/library configuration to dot instead of the Python test runtime.
          cat > "$RUNNER_TEMP/graphviz-bin/dot" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          graphviz_root="$(dirname "$(dirname "$0")")/graphviz-16.1.1"
          export LD_LIBRARY_PATH="$graphviz_root/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export GVBINDIR="$graphviz_root/usr/lib/graphviz"
          exec "$graphviz_root/usr/bin/dot" "$@"
          WRAPPER
          chmod +x "$RUNNER_TEMP/graphviz-bin/dot"
          "$RUNNER_TEMP/graphviz-bin/dot" -V
          printf 'digraph { a -> b }\n' | "$RUNNER_TEMP/graphviz-bin/dot" -Tsvg > "$RUNNER_TEMP/graphviz-smoke.svg"
          grep -q '<svg' "$RUNNER_TEMP/graphviz-smoke.svg"
          echo "$RUNNER_TEMP/graphviz-bin" >> "$GITHUB_PATH"
      - name: Install reference validation dependencies
        run: python3 -m pip install -r skills/report-evidence/scripts/requirements.txt
      - name: Verify the profile-manager chain end to end
        run: python3 -m unittest tests.test_profile_manager_e2e -v
      - name: Validate metadata and run all repository and skill checks
        run: bash scripts/check.sh

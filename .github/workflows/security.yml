name: Security

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install checksum-pinned Gitleaks 8.30.1
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | (cd "$scanner_dir" && sha256sum --check --strict)
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          test "$("$scanner_dir/gitleaks" version)" = '8.30.1'
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Run Gitleaks regression tests
        run: python3 scripts/test_secret_scan.py
      - name: Scan reachable blobs, paths, refs, and commit and tag metadata
        run: bash scripts/scan-secrets.sh .

  institutional-data:
    name: Institutional data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Run disclosure-gate regression tests
        run: python3 -m unittest discover -s tests -p test_institutional_scan.py -v
      - name: Scan index, historical trees, refs, and all commit and tag metadata
        run: python3 scripts/scan-institutional-data.py

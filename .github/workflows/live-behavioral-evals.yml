name: Live Behavioral Evals

# Opt-in and on demand only: executes behavioral evals against a model when someone starts
# it. It never runs on pull requests, merge queues or pushes, because each run spends model
# usage. It authenticates to Anthropic through GitHub OIDC workload identity federation
# (ANTHROPIC_FEDERATION_RULE_ID and ANTHROPIC_ORGANIZATION_ID repository variables).
#
# Spend is metered and capped: every model call goes through scripts/live-evals-runner/claude,
# which records its cost, and runs pause once the month's spend reaches the
# LIVE_EVALS_MONTHLY_BUDGET_USD repository variable (default $10). See
# scripts/live_eval_spend.py.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to evaluate, or "all" for the whole catalog
        required: true
        default: all
        type: string
      model:
        description: Model that performs and grades the evals (Sonnet for routine runs, Fable to check behavior under stress)
        required: true
        default: claude-sonnet-5-5
        type: choice
        options:
          - claude-sonnet-5-5
          - claude-fable-5-2

# One run at a time, queued, so each run's budget check sees every earlier run's spend.
concurrency:
  group: live-behavioral-evals
  cancel-in-progress: false

env:
  MONTHLY_BUDGET_USD: ${{ vars.LIVE_EVALS_MONTHLY_BUDGET_USD || '10' }}

permissions:
  contents: read

jobs:
  skills:
    name: Resolve requested skills and calculate spend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The budget check reads earlier runs' spend artifacts through the Actions API.
    permissions:
      contents: read
      actions: read
    outputs:
      skills: ${{ steps.list.outputs.skills }}
      evals: ${{ steps.list.outputs.evals }}
      shares: ${{ steps.budget.outputs.shares }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the requested skills
        id: list
        env:
          SKILL: ${{ inputs.skill }}
        run: |
          set -euo pipefail
          skills=$(python3 - <<'PY'
          import json, os, pathlib, sys
          known = sorted(p.stem for p in pathlib.Path("skill_evals/cases").glob("*.json"))
          wanted = os.environ["SKILL"].strip()
          if wanted == "all":
              print(json.dumps(known))
          elif wanted in known:
              print(json.dumps([wanted]))
          else:
              sys.exit("Unknown skill; use all or one of: " + ", ".join(known))
          PY
          )
          printf 'skills=%s\n' "$skills" >>"$GITHUB_OUTPUT"
          evals=$(python3 -c 'import json, sys; print(json.dumps({s: len(json.load(open(f"skill_evals/cases/{s}.json"))["evals"]) for s in json.loads(sys.argv[1])}, separators=(",", ":")))' "$skills")
          printf 'evals=%s\n' "$evals" >>"$GITHUB_OUTPUT"

      - name: Check this month's spend
        id: budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVALS: ${{ steps.list.outputs.evals }}
        run: |
          set -euo pipefail
          python3 scripts/live_eval_spend.py month --budget "$MONTHLY_BUDGET_USD" --evals "$EVALS" \
            --repository "$GITHUB_REPOSITORY" --workflow live-behavioral-evals.yml --run-id "$GITHUB_RUN_ID"

  live-evals:
    name: Live evals (${{ matrix.skill }}, ${{ inputs.model }})
    needs: skills
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        skill: ${{ fromJSON(needs.skills.outputs.skills) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the model credential
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        run: |
          if [ -z "$ANTHROPIC_FEDERATION_RULE_ID" ] || [ -z "$ANTHROPIC_ORGANIZATION_ID" ]; then
            echo '::error::ANTHROPIC_FEDERATION_RULE_ID or ANTHROPIC_ORGANIZATION_ID variable is not set.'
            exit 1
          fi

      - name: Install the pinned Claude Code runner
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.332
          claude --version

      - name: Execute the skill's behavioral evals
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_011STeYdkVGepjQBALKrB8CM
          ANTHROPIC_WORKSPACE_ID: wrkspc_01L6vCTR95hgQx5JNzE7thNs
          ANTHROPIC_MODEL: ${{ inputs.model }}
          SKILL: ${{ matrix.skill }}
          LIVE_EVAL_JOB_BUDGET_USD: ${{ fromJSON(needs.skills.outputs.shares)[matrix.skill] }}
        run: |
          set -o pipefail
          results="$RUNNER_TEMP/live-eval-results"
          mkdir -p "$results"
          LIVE_EVAL_REAL_CLAUDE=$(command -v claude)
          LIVE_EVAL_LEDGER="$RUNNER_TEMP/live-eval-ledger.jsonl"
          export LIVE_EVAL_REAL_CLAUDE LIVE_EVAL_LEDGER
          echo "This job may spend up to \$$LIVE_EVAL_JOB_BUDGET_USD."
          scripts/run-skill-quality-gate.sh --execute-behavioral --skill "$SKILL" \
            --runner-dir scripts/live-evals-runner \
            --output-dir "$results" 2>&1 | tee "$results/runner.log"

      - name: Record this job's spend
        if: always()
        env:
          SKILL: ${{ matrix.skill }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          ledger="$RUNNER_TEMP/live-eval-ledger.jsonl"
          touch "$ledger"
          python3 scripts/live_eval_spend.py summary --ledger "$ledger" \
            --output "$RUNNER_TEMP/live-eval-spend/spend.json" \
            --skill "$SKILL" --model "$MODEL" --run-id "$GITHUB_RUN_ID"
          cp "$ledger" "$RUNNER_TEMP/live-eval-results/ledger.jsonl"
          if [ -d "$HOME/.claude/projects" ]; then
            cp -R "$HOME/.claude/projects" "$RUNNER_TEMP/live-eval-results/sessions"
          fi

      - name: Upload the spend record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # The budget check reads these back, so keep them past the end of the month.
          name: live-evals-spend-${{ matrix.skill }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-eval-spend
          if-no-files-found: error
          retention-days: 40

      - name: Upload grading files, model calls and ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-evals-${{ matrix.skill }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-eval-results
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
